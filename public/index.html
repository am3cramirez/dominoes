<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dominoes — Multiplayer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="toasts"></div>

  <!-- HOME -->
  <section id="screen-home" class="screen active">
    <div class="card home-card">
      <h1>🁣 Dominoes</h1>
      <p class="tagline">Play dominoes online with friends</p>
      <input id="name-input" type="text" maxlength="20" placeholder="Your name" autocomplete="off" />
      <button id="btn-create" class="btn primary">Create Room</button>
      <div class="divider"><span>or join a room</span></div>
      <div class="join-row">
        <input id="code-input" type="text" maxlength="5" placeholder="CODE" autocomplete="off" />
        <button id="btn-join" class="btn">Join</button>
      </div>
      <p id="home-error" class="error"></p>
    </div>
  </section>

  <!-- LOBBY -->
  <section id="screen-lobby" class="screen">
    <div class="card lobby-card">
      <h2>Room Code</h2>
      <div class="code-box">
        <span id="lobby-code">—</span>
        <button id="btn-copy" class="btn small" title="Copy code">Copy</button>
      </div>
      <p class="hint">Share this code — friends enter it on the home screen to join. 2–4 players.</p>
      <ul id="lobby-players" class="player-list"></ul>
      <button id="btn-start" class="btn primary">Start Game</button>
      <p id="lobby-hint" class="hint"></p>
      <button id="btn-leave-lobby" class="btn ghost">Leave room</button>
    </div>
  </section>

  <!-- GAME -->
  <section id="screen-game" class="screen">
    <div id="table">
      <button id="btn-leave-game" class="back-btn" title="Leave game">←</button>
      <div id="game-chips">
        <span class="chip">Room <b id="game-code">—</b></span>
        <span class="chip">🁠 <b id="boneyard-count">0</b></span>
      </div>

      <div id="seat-top" class="seat seat-h"></div>
      <div id="seat-left" class="seat seat-v"></div>
      <div id="seat-right" class="seat seat-v"></div>

      <div id="board-wrap">
        <div id="board"></div>
      </div>

      <div id="turn-label"></div>
      <div id="bonus-banner" class="hidden">
        <div class="bonus-points"></div>
        <div class="bonus-text"></div>
      </div>

      <div id="my-seat">
        <div id="my-avatar"></div>
        <div id="my-center">
          <div id="hand"></div>
        </div>
        <div id="my-points" class="seat-points"></div>
        <div id="turn-bar"></div>
      </div>
    </div>

    <!-- side chooser popover -->
    <div id="side-chooser" class="hidden">
      <button data-side="left" class="btn">◀ Left end</button>
      <button data-side="right" class="btn">Right end ▶</button>
    </div>

    <!-- round over overlay -->
    <div id="overlay" class="hidden">
      <div class="card overlay-card">
        <h2 id="overlay-title"></h2>
        <p id="overlay-sub"></p>
        <div id="overlay-scores"></div>
        <button id="btn-next-round" class="btn primary">Next Round</button>
        <button id="btn-back-home" class="btn ghost">Back to Home</button>
      </div>
    </div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
