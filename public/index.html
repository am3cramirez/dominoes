<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dominoes — Multiplayer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="toasts"></div>

  <!-- HOME -->
  <section id="screen-home" class="screen active">
    <div class="card home-card">
      <h1>
        <svg class="logo-tile" viewBox="0 0 26 46" aria-hidden="true"><rect x="1" y="1" width="24" height="44" rx="5" fill="#2e3950" stroke="#1c2430" stroke-width="1.5"/><line x1="4" y1="23" x2="22" y2="23" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/><circle cx="8" cy="8" r="2.6" fill="#ff9f1c"/><circle cx="18" cy="16" r="2.6" fill="#ff9f1c"/><circle cx="8" cy="30" r="2.6" fill="#3bbcd9"/><circle cx="18" cy="30" r="2.6" fill="#3bbcd9"/><circle cx="8" cy="38" r="2.6" fill="#3bbcd9"/><circle cx="18" cy="38" r="2.6" fill="#3bbcd9"/></svg>
        Dominoes
      </h1>
      <p class="tagline">Play dominoes online with friends</p>
      <input id="name-input" type="text" maxlength="20" placeholder="Your name" autocomplete="off" />
      <button id="btn-quick" class="btn primary">▶ Play Now</button>
      <p class="hint">Jump into an open table with other players</p>
      <div class="divider"><span>or play with friends</span></div>
      <button id="btn-create" class="btn">Create Private Room</button>
      <div class="join-row">
        <input id="code-input" type="text" maxlength="5" placeholder="CODE" autocomplete="off" />
        <button id="btn-join" class="btn">Join</button>
      </div>
      <p id="home-error" class="error"></p>
    </div>
  </section>

  <!-- LOBBY -->
  <section id="screen-lobby" class="screen">
    <div class="card lobby-card">
      <h2>Room Code</h2>
      <div class="code-box">
        <span id="lobby-code">—</span>
        <button id="btn-copy" class="btn small" title="Copy code">Copy</button>
      </div>
      <p id="lobby-visibility" class="hint"></p>
      <p id="lobby-countdown" class="countdown"></p>
      <ul id="lobby-players" class="player-list"></ul>
      <button id="btn-start" class="btn primary">Start Game</button>
      <p id="lobby-hint" class="hint"></p>
      <button id="btn-leave-lobby" class="btn ghost">Leave room</button>
    </div>
  </section>

  <!-- TALLY (round result, no click required) -->
  <div id="tally" class="hidden">
    <div class="card tally-card">
      <h2 id="tally-title"></h2>
      <p id="tally-sub"></p>
      <div id="tally-rows"></div>
    </div>
  </div>

  <!-- GAME -->
  <section id="screen-game" class="screen">
    <div id="table">
      <button id="btn-leave-game" class="back-btn" title="Leave game">←</button>
      <div id="game-chips">
        <span class="chip">Room <b id="game-code">—</b></span>
        <span class="chip">🁠 <b id="boneyard-count">0</b></span>
      </div>

      <div id="seat-top" class="seat seat-h"></div>
      <div id="seat-left" class="seat seat-v"></div>
      <div id="seat-right" class="seat seat-v"></div>

      <div id="board-wrap">
        <div id="board"></div>
      </div>

      <div id="turn-label"></div>
      <div id="bonus-banner" class="hidden">
        <div class="bonus-points"></div>
        <div class="bonus-text"></div>
      </div>

      <div id="my-seat">
        <div id="my-avatar"></div>
        <div id="my-center">
          <div id="hand"></div>
        </div>
        <div id="my-points" class="seat-points"></div>
        <div id="turn-bar"></div>
      </div>
    </div>

    <!-- side chooser popover -->
    <div id="side-chooser" class="hidden">
      <button data-side="left" class="btn">◀ Left end</button>
      <button data-side="right" class="btn">Right end ▶</button>
    </div>

    <!-- match over: only shown once someone reaches the target score -->
    <div id="overlay" class="hidden">
      <div class="card overlay-card">
        <h2 id="overlay-title"></h2>
        <p id="overlay-sub"></p>
        <div id="overlay-scores"></div>
        <button id="btn-next-round" class="btn primary">Play Again</button>
        <button id="btn-back-home" class="btn ghost">Back to Home</button>
      </div>
    </div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
